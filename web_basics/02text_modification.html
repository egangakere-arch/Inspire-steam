<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module02: input, button</title>
</head>
<body>
    <label for="f_name">Your first name </label>
    <input type="text" placeholder="John Doe" name="f_name">
    <br><br>

    <label for="u_email">your email</label>
    <input type="email" name="u_email" placeholder="sample@gmail.com">
    <br><br>

    <label for="u_phone">Your telephone number</label>
    <input type="tel" name="u_phone" placeholder="+25412345678">
</body>
</html>
