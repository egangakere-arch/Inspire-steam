<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module05: classes, ids</title>

    <style>
        body{
            background-color: black;
            color: beige;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
        }
        #page-wrapper{
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .band-photos{
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
        #photos{
            background-color: antiquewhite;
        }
        #listen-section{
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 500px;
            background-color: bisque;
            color: black;
            margin: 0;
            padding: 0;
        }
        
        #listen-section p{
            margin: 0;
            padding: 10px;
        }
    </style>
</head>
<body>
   <!--
        id: unique, only one element in a page should have it

        class: reusable. used to identify multiple elements together
   --> 
    <div id="page-wrapper">
        <h1>Duality</h1>
        <p>Disc: Band from the roots of Nairobi, transforming african music</p>
        <div id="photos">
            <img class="band-photos" src="./assets/images/swan.jpg" alt="band photo">
            <img class="band-photos" src="./assets/images/image.jpeg" alt="band photo">
        </div>

        <div id="listen-section">
            <p>Latest song</p>
            <p>Earlier song</p>
        </div>
        
    </div>
</body>
</html>
