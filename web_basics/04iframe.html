<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module04: iframes</title>
</head>
<body>
    <!--
    Embed another mebsites content
    within your website

    Attributes:
    src - link to resource online
    midth, height - size of window (pixels)
    title - people with screen readers etc
    allow full screen - let teh user go full screen
    -->
    <iframe
     src="https://www.youtube.com/watch?v=zTKheLpo4nQ&list=RDzTKheLpo4nQ&start_radio=1&pp=oAcB"
     width="560" 
     height="315" 
     title="YouTube video player" 
     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
     allowfullscreen>
    </iframe>
</body>
</html>
