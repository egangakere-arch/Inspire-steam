<html>
    <head>
        <title>Module01: h1 , h2 , p , em , div </title>
    </head>

    <body>
        <h1>Music Band</h1>
        <hr>

        <h2>About the band </h2>
        <div>
            <!--em (emphasis) b (bold)-->
            <p>Redicovering music, <em>one album at a time</em></p>
            <p>Est <b>2026</b></p>

            <!-- small (small text) and i (italic)-->
             <p><small><i>Find our math at match.ebay.com</i></small></p>
             <hr>
        </div>
        <div>
            <!-- sub (subscript), sup (superscript), li-->
             <h3> Discover</h3>
             <li>H <sub>2</sub>o</li>
             <li> E is MC <sup>o</sup></li>
             
             <h4>Lyrics H <sub>2</sub>0</h4>
             <i>
                i am a silent swimmer, in a liquid  sky,
                where the currents flow, and clouds drift by
             </i>
        </div>
    </body>

</html>
